<!DOCTYPE html>
<html lang="pt-br">

<head>
   <meta charset="UTF-8">
   <meta name="viewport" content="width=device-width, initial-scale=1.0">
   <title>Tanque de Guerra - Movimento e Disparo</title>

   <link rel="stylesheet" href="css/estilo.css">

   <script src="js/teclado.js"></script>
   <script src="js/animacao.js"></script>
   <script src="js/cenario.js"></script>
   <script src="js/projetil.js"></script>
   <script src="js/tanque.js"></script>
</head>

<body>

   <canvas id="campoDeBatalha"></canvas>

   <div class="titulo">
      <h1>Tanque de Guerra</h1>
      <p>Movimente-se pelo campo de batalha e dispare com o canhão</p>
   </div>

   <div class="rodape">
      Atividade de Desenvolvimento de Jogos Digitais &middot; tema: tanque de guerra
   </div>

   <script>
      var canvas  = document.getElementById('campoDeBatalha');
      var context = canvas.getContext('2d');

      var teclado  = new Teclado(document);
      var animacao = new Animacao(context);

      var cenario = new Cenario(context);
      animacao.novoSprite(cenario);

      var tanque = new Tanque(context, teclado, animacao);
      tanque.x = 60;
      animacao.novoSprite(tanque);

      function ajustarTela() {
         canvas.width  = window.innerWidth;
         canvas.height = window.innerHeight;

         cenario.chaoY = Math.round(canvas.height * 0.775);
         tanque.y = cenario.chaoY - 50;

         var limiteDireita = canvas.width - tanque.largura - tanque.margem;
         if (tanque.x > limiteDireita) tanque.x = limiteDireita;
      }

      ajustarTela();
      window.addEventListener('resize', ajustarTela);

      teclado.disparou(ESPACO, function() {
         tanque.atirar();
      });

      animacao.ligar();
   </script>

</body>

</html>
